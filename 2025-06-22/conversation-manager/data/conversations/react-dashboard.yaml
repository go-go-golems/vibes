    content: "Perfect! Can you also add dark mode support?"
    timestamp: "2025-06-22T14:45:00Z"
  - id: "msg-004"
    parent_id: "msg-003"
    role: "assistant"
    content: "Absolutely! Here's how to add dark mode support using CSS custom properties and a theme context:\n\n```tsx\n// ThemeContext.tsx\nimport React, { createContext, useContext, useState } from 'react';\n\ntype Theme = 'light' | 'dark';\n\ninterface ThemeContextType {\n  theme: Theme;\n  toggleTheme: () => void;\n}\n\nconst ThemeContext = createContext<ThemeContextType | undefined>(undefined);\n\nexport const useTheme = () => {\n  const context = useContext(ThemeContext);\n  if (!context) {\n    throw new Error('useTheme must be used within a ThemeProvider');\n  }\n  return context;\n};\n\nexport const ThemeProvider: React.FC<{ children: React.ReactNode }> = ({ children }) => {\n  const [theme, setTheme] = useState<Theme>('light');\n\n  const toggleTheme = () => {\n    setTheme(prev => prev === 'light' ? 'dark' : 'light');\n  };\n\n  return (\n    <ThemeContext.Provider value={{ theme, toggleTheme }}>\n      <div className={`theme-${theme}`}>\n        {children}\n      </div>\n    </ThemeContext.Provider>\n  );\n};\n```\n\nAnd update your CSS with custom properties:\n\n```css\n:root {\n  --bg-primary: #ffffff;\n  --bg-secondary: #f8f9fa;\n  --text-primary: #212529;\n  --text-secondary: #6c757d;\n  --border-color: #dee2e6;\n}\n\n.theme-dark {\n  --bg-primary: #1a1a1a;\n  --bg-secondary: #2d2d2d;\n  --text-primary: #ffffff;\n  --text-secondary: #b0b0b0;\n  --border-color: #404040;\n}\n\n.dashboard {\n  background-color: var(--bg-primary);\n  color: var(--text-primary);\n}\n\n.card {\n  background-color: var(--bg-secondary);\n  border: 1px solid var(--border-color);\n  padding: 1rem;\n  border-radius: 8px;\n}\n```\n\nNow your dashboard will automatically adapt to the selected theme!"
    timestamp: "2025-06-22T14:45:00Z"

