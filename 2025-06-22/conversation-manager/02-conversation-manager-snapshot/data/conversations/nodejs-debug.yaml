    content: "Perfect! The CORS error is now resolved. Can you also show me how to add proper error handling to the API?"
    timestamp: "2025-06-21T16:35:00Z"
  - id: "msg-016"
    parent_id: "msg-015"
    role: "assistant"
    content: "Excellent! Proper error handling is crucial for a robust API. Here's a comprehensive error handling setup:\n\n```javascript\nconst express = require('express');\nconst cors = require('cors');\nconst app = express();\n\napp.use(cors());\napp.use(express.json());\n\n// Custom error class\nclass AppError extends Error {\n  constructor(message, statusCode) {\n    super(message);\n    this.statusCode = statusCode;\n    this.isOperational = true;\n    \n    Error.captureStackTrace(this, this.constructor);\n  }\n}\n\n// Async wrapper to catch errors\nconst catchAsync = (fn) => {\n  return (req, res, next) => {\n    fn(req, res, next).catch(next);\n  };\n};\n\n// Mock database function that might fail\nconst getUsers = async () => {\n  // Simulate random failure\n  if (Math.random() < 0.3) {\n    throw new Error('Database connection failed');\n  }\n  return ['Alice', 'Bob', 'Charlie'];\n};\n\n// Routes with proper error handling\napp.get('/api/users', catchAsync(async (req, res, next) => {\n  try {\n    const users = await getUsers();\n    \n    if (!users || users.length === 0) {\n      return next(new AppError('No users found', 404));\n    }\n    \n    res.status(200).json({\n      success: true,\n      data: { users },\n      count: users.length\n    });\n  } catch (error) {\n    return next(new AppError('Failed to fetch users', 500));\n  }\n}));\n\napp.get('/api/users/:id', catchAsync(async (req, res, next) => {\n  const { id } = req.params;\n  \n  // Validate input\n  if (!id || isNaN(id)) {\n    return next(new AppError('Invalid user ID', 400));\n  }\n  \n  // Simulate user lookup\n  const users = await getUsers();\n  const user = users[parseInt(id) - 1];\n  \n  if (!user) {\n    return next(new AppError('User not found', 404));\n  }\n  \n  res.status(200).json({\n    success: true,\n    data: { user }\n  });\n}));\n\n// Handle 404 for undefined routes\napp.all('*', (req, res, next) => {\n  next(new AppError(`Route ${req.originalUrl} not found`, 404));\n});\n\n// Global error handling middleware\nconst globalErrorHandler = (err, req, res, next) => {\n  err.statusCode = err.statusCode || 500;\n  err.status = err.status || 'error';\n  \n  // Log error for debugging\n  console.error('Error:', {\n    message: err.message,\n    stack: err.stack,\n    url: req.originalUrl,\n    method: req.method,\n    timestamp: new Date().toISOString()\n  });\n  \n  // Development vs Production error responses\n  if (process.env.NODE_ENV === 'development') {\n    res.status(err.statusCode).json({\n      success: false,\n      error: {\n        message: err.message,\n        stack: err.stack,\n        statusCode: err.statusCode\n      }\n    });\n  } else {\n    // Production - don't leak error details\n    if (err.isOperational) {\n      res.status(err.statusCode).json({\n        success: false,\n        message: err.message\n      });\n    } else {\n      res.status(500).json({\n        success: false,\n        message: 'Something went wrong'\n      });\n    }\n  }\n};\n\napp.use(globalErrorHandler);\n\n// Graceful shutdown handling\nprocess.on('uncaughtException', (err) => {\n  console.error('Uncaught Exception:', err);\n  process.exit(1);\n});\n\nprocess.on('unhandledRejection', (err) => {\n  console.error('Unhandled Rejection:', err);\n  process.exit(1);\n});\n\nconst PORT = process.env.PORT || 3001;\napp.listen(PORT, () => {\n  console.log(`Server running on port ${PORT}`);\n});\n```\n\n**Key features:**\n\n1. **Custom Error Class**: Distinguishes operational errors from programming errors\n2. **Async Error Wrapper**: Automatically catches async errors\n3. **Input Validation**: Validates request parameters\n4. **Consistent Response Format**: Standardized JSON responses\n5. **Environment-aware**: Different error details for dev vs production\n6. **Global Error Handler**: Centralized error processing\n7. **Graceful Shutdown**: Handles uncaught exceptions\n\nNow your API will handle errors gracefully and provide meaningful responses to the frontend!"
