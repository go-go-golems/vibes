  - id: "msg-013"
    parent_id: null
    role: "user"
    content: "I'm getting a CORS error when trying to call my Node.js API from my React frontend. The API works fine in Postman but fails in the browser. Here's my Express setup:\n\n```javascript\nconst express = require('express');\nconst app = express();\n\napp.get('/api/users', (req, res) => {\n  res.json({ users: ['Alice', 'Bob'] });\n});\n\napp.listen(3001, () => {\n  console.log('Server running on port 3001');\n});\n```"
    timestamp: "2025-06-21T16:15:00Z"
  - id: "msg-014"
    parent_id: "msg-013"
    role: "assistant"
    content: "The CORS error occurs because browsers enforce the Same-Origin Policy, which blocks requests from different origins (different protocol, domain, or port). Postman doesn't enforce this, which is why it works there.\n\nHere's how to fix it by adding CORS middleware:\n\n**Option 1: Using the cors package (recommended)**\n```javascript\nconst express = require('express');\nconst cors = require('cors');\nconst app = express();\n\n// Install: npm install cors\n\n// Enable CORS for all routes\napp.use(cors());\n\n// Or configure specific origins\napp.use(cors({\n  origin: ['http://localhost:3000', 'http://localhost:3001'],\n  credentials: true,\n  optionsSuccessStatus: 200\n}));\n\napp.get('/api/users', (req, res) => {\n  res.json({ users: ['Alice', 'Bob'] });\n});\n\napp.listen(3001, () => {\n  console.log('Server running on port 3001');\n});\n```\n\n**Option 2: Manual CORS headers**\n```javascript\nconst express = require('express');\nconst app = express();\n\n// Manual CORS middleware\napp.use((req, res, next) => {\n  res.header('Access-Control-Allow-Origin', '*'); // Or specific origin\n  res.header('Access-Control-Allow-Methods', 'GET, POST, PUT, DELETE, OPTIONS');\n  res.header('Access-Control-Allow-Headers', 'Origin, X-Requested-With, Content-Type, Accept, Authorization');\n  \n  // Handle preflight requests\n  if (req.method === 'OPTIONS') {\n    res.sendStatus(200);\n  } else {\n    next();\n  }\n});\n\napp.get('/api/users', (req, res) => {\n  res.json({ users: ['Alice', 'Bob'] });\n});\n\napp.listen(3001, () => {\n  console.log('Server running on port 3001');\n});\n```\n\n**Option 3: Environment-specific CORS**\n```javascript\nconst express = require('express');\nconst cors = require('cors');\nconst app = express();\n\nconst corsOptions = {\n  origin: process.env.NODE_ENV === 'production' \n    ? ['https://yourdomain.com'] \n    : ['http://localhost:3000', 'http://localhost:3001'],\n  credentials: true\n};\n\napp.use(cors(corsOptions));\n\napp.get('/api/users', (req, res) => {\n  res.json({ users: ['Alice', 'Bob'] });\n});\n\napp.listen(3001, () => {\n  console.log('Server running on port 3001');\n});\n```\n\nI recommend **Option 1** with the cors package as it's the most robust and handles edge cases automatically."
    timestamp: "2025-06-21T16:25:00Z"
