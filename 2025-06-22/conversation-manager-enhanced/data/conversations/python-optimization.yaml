    role: "assistant"
    content: "Absolutely! Here's how to profile and compare the performance of different approaches:\n\n```python\nimport pandas as pd\nimport numpy as np\nimport time\nfrom memory_profiler import profile\n\n# Create a large test dataset\nnp.random.seed(42)\nn_rows = 100000\ndf = pd.DataFrame({\n    'category': np.random.choice(['A', 'B', 'C'], n_rows),\n    'value': np.random.randint(0, 200, n_rows)\n})\n\nprint(f\"Dataset size: {len(df):,} rows\")\nprint(f\"Category A rows: {len(df[df['category'] == 'A']):,}\")\n\n# Method 1: Original (slow) approach\ndef slow_method(df):\n    df_result = df[df['category'] == 'A'].copy()\n    for index, row in df_result.iterrows():\n        if row['value'] > 100:\n            df_result.loc[index, 'status'] = 'high'\n        else:\n            df_result.loc[index, 'status'] = 'low'\n    return df_result\n\n# Method 2: Vectorized with np.where\ndef fast_method(df):\n    df_result = df[df['category'] == 'A'].copy()\n    df_result['status'] = np.where(df_result['value'] > 100, 'high', 'low')\n    return df_result\n\n# Method 3: Using pd.cut\ndef fastest_method(df):\n    df_result = df[df['category'] == 'A'].copy()\n    df_result['status'] = pd.cut(df_result['value'], \n                                bins=[-np.inf, 100, np.inf], \n                                labels=['low', 'high'])\n    return df_result\n\n# Benchmark function\ndef benchmark_method(func, df, name, runs=3):\n    times = []\n    for i in range(runs):\n        start = time.time()\n        result = func(df)\n        end = time.time()\n        times.append(end - start)\n    \n    avg_time = np.mean(times)\n    print(f\"{name}: {avg_time:.4f}s (±{np.std(times):.4f}s)\")\n    return result, avg_time\n\n# Run benchmarks\nprint(\"\\nPerformance Comparison:\")\nprint(\"=\" * 40)\n\n# Skip slow method for very large datasets\nif len(df[df['category'] == 'A']) < 10000:\n    result1, time1 = benchmark_method(slow_method, df, \"Slow (iterrows)\")\nelse:\n    print(\"Slow (iterrows): Skipped (too slow for large dataset)\")\n    time1 = float('inf')\n\nresult2, time2 = benchmark_method(fast_method, df, \"Fast (np.where)\")\nresult3, time3 = benchmark_method(fastest_method, df, \"Fastest (pd.cut)\")\n\n# Calculate speedup\nif time1 != float('inf'):\n    print(f\"\\nSpeedup vs original: {time1/time2:.1f}x (np.where), {time1/time3:.1f}x (pd.cut)\")\nprint(f\"pd.cut vs np.where speedup: {time2/time3:.1f}x\")\n\n# Memory profiling (install with: pip install memory-profiler)\n@profile\ndef memory_test():\n    df_test = df.head(10000)  # Smaller dataset for memory profiling\n    result = fast_method(df_test)\n    return result\n\n# Run: python -m memory_profiler your_script.py\n# memory_test()\n```\n\nTo use this:\n\n1. **Install memory-profiler**: `pip install memory-profiler`\n2. **Run the script** to see timing comparisons\n3. **For memory profiling**: Run with `python -m memory_profiler your_script.py`\n\nYou'll typically see 10-100x speedup with vectorized operations!"
