version: '3.8'

services:
  pelican-farm:
    build: .
    container_name: pelican-farm-app
    ports:
      - "8080:8080"
    volumes:
      - pelican_data:/app/data
    environment:
      - GIN_MODE=release
      - DB_PATH=/app/data/pelican_farm.db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/pelicans/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - pelican-network

  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: pelican-farm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - pelican-farm
    networks:
      - pelican-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  pelican_data:
    driver: local

networks:
  pelican-network:
    driver: bridge
