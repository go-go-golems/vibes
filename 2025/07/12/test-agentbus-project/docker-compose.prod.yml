version: '3.8'

services:
  pelican-farm:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: pelican-farm-app-prod
    environment:
      - GIN_MODE=release
      - DB_PATH=/app/data/pelican_farm.db
      - PORT=8080
      - LOG_LEVEL=info
    volumes:
      - pelican_data_prod:/app/data
      - pelican_logs_prod:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/pelicans/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - pelican-network-prod
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  nginx:
    image: nginx:alpine
    container_name: pelican-farm-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - pelican_logs_prod:/var/log/nginx
    depends_on:
      pelican-farm:
        condition: service_healthy
    networks:
      - pelican-network-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # Log aggregation
  fluentd:
    image: fluent/fluentd:v1.16-1
    container_name: pelican-farm-logs-prod
    volumes:
      - ./fluentd:/fluentd/etc
      - pelican_logs_prod:/var/log
    networks:
      - pelican-network-prod
    restart: unless-stopped
    profiles:
      - logging

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: pelican-farm-prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    networks:
      - pelican-network-prod
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  pelican_data_prod:
    driver: local
  pelican_logs_prod:
    driver: local
  prometheus_data_prod:
    driver: local

networks:
  pelican-network-prod:
    driver: bridge
